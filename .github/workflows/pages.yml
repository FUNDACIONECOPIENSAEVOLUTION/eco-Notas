name: Eco-Notas · pruebas y publicación
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    name: Verificar código y motor de calificaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar JavaScript
        run: |
          node --check state.js
          node --check exam.js
          node --check scan.js
          node --check app.js
          node --check sync.js
          node --check cloudflare/worker.mjs
      - name: Pruebas unitarias
        run: |
          node tests/smoke.cjs
          node tests/sync.cjs
          node tests/scan-ui.cjs
          node tests/cloudflare.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar y probar backend Java
        run: |
          javac backend/EcoNotasServer.java backend/EcoNotasServerTest.java
          java -cp backend EcoNotasServerTest
  deploy:
    name: Publicar GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar si Pages está activado
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages no está activado. Habilítalo en Settings > Pages > Source: GitHub Actions y vuelve a ejecutar el flujo."
          fi
      - name: Configurar GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Preparar archivos de publicación
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp index.html state.js exam.js scan.js app.js sync.js _site/
          touch _site/.nojekyll
      - name: Empaquetar sitio
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
