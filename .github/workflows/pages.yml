name: Eco-Notas · pruebas y publicación
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    name: Verificar código y motor de calificaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar JavaScript
        run: |
          node --check state.js
          node --check exam.js
          node --check scan.js
          node --check app.js
      - name: Pruebas unitarias
        run: node tests/smoke.cjs
  deploy:
    name: Publicar GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos de publicación
        run: |
          mkdir -p _site
          cp index.html state.js exam.js scan.js app.js _site/
          touch _site/.nojekyll
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
