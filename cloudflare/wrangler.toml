name = "eco-notas-api"
main = "./worker.mjs"
compatibility_date = "2026-10-30"
workers_dev = true

[vars]
ECONOTAS_USER = "docente"
ECONOTAS_ALLOWED_ORIGIN = "https://fundacionecopiensaevolution.github.io"

# Completar con el ID real que devuelve "wrangler d1 create eco-notas-db":
[[d1_databases]]
binding = "DB"
database_name = "eco-notas-db"
database_id = "REPLACE_WITH_ACTUAL_D1_DATABASE_ID"
